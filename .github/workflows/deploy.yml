name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 오push 방어: remote owner가 givepro91이 아니면 중단
      - name: Guard repo owner
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$owner" != "givepro91" ]; then
            echo "::error::Unexpected repository owner '$owner' (expected givepro91)"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5

      - run: pnpm install --frozen-lockfile
      # build = disclosure 게이트(source) → astro build → 게이트(dist)
      - run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
